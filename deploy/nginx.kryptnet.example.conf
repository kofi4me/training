# Include inside the existing HTTPS server block that handles www.kryptnet.org.
location = /training {
    return 308 /training/$is_args$args;
}

# Keep authorization codes out of the Nginx access log.
location ^~ /training/auth/ {
    access_log off;
    client_max_body_size 16k;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:5317;
}

location ^~ /training/ {
    client_max_body_size 16k;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_pass http://127.0.0.1:5317;
}
